x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-local}
  APP_NAME: ${APP_NAME:-Magento Product Automation}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catalog:catalog@postgres:5432/catalog}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
  MAGENTO_BASE_URL: ${MAGENTO_BASE_URL:-https://www.example.com}
  MAGENTO_API_TOKEN: ${MAGENTO_API_TOKEN:-}
  MAGENTO_STORE_VIEW: ${MAGENTO_STORE_VIEW:-admin}
  MAGENTO_DEFAULT_ATTRIBUTE_SET_ID: ${MAGENTO_DEFAULT_ATTRIBUTE_SET_ID:-4}
  MAGENTO_DEFAULT_TAX_CLASS_ID: ${MAGENTO_DEFAULT_TAX_CLASS_ID:-2}
  MAGENTO_DEFAULT_WEBSITE: ${MAGENTO_DEFAULT_WEBSITE:-base}
  MEDIA_BASE_PATH: ${MEDIA_BASE_PATH:-/mnt/media}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://imgcdn1.gempundit.com/media/catalog/product}
  UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-100}
  DEFAULT_PRODUCT_STATUS: ${DEFAULT_PRODUCT_STATUS:-2}
  DEFAULT_PRODUCT_VISIBILITY: ${DEFAULT_PRODUCT_VISIBILITY:-4}
  DEFAULT_PRODUCT_TYPE: ${DEFAULT_PRODUCT_TYPE:-simple}
  DEFAULT_PRODUCT_WEIGHT: ${DEFAULT_PRODUCT_WEIGHT:-0.15}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment: *api-environment
    volumes:
      - ./backend:/app
      - ./samples:/samples
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    environment: *api-environment
    volumes:
      - ./backend:/app
      - ./samples:/samples
    depends_on:
      - api
      - redis
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api

volumes:
  pgdata:
